<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Assistant</title>
    <link rel="icon" type="image/png" href="./img/sf_logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="./img/sf_logo.png" alt="SunFounder Logo">
        <h1>AI Vision Assistant</h1>
        <p>Camera · Vision LLM · Text-to-Speech</p>
    </header>

    <main>
        <section class="card">
            <div class="connection">
                <span id="status-dot" class="status-indicator"></span>
                <span id="connection-label">Connecting</span>
            </div>

            <div class="camera-frame">
                <img id="camera-stream" src="" crossorigin="anonymous" alt="Live camera view">
                <div id="camera-placeholder">Waiting for camera...</div>
            </div>

            <div id="status-panel" class="status-panel">
                <strong id="status-title">Connecting...</strong>
                <span id="status-message">Waiting for the app.</span>
            </div>

            <form id="question-form">
                <label for="question-input">Ask about the image</label>
                <div class="question-row">
                    <input
                        id="question-input"
                        type="text"
                        maxlength="300"
                        value="What can you see?"
                        autocomplete="off"
                    >
                    <button id="ask-button" type="submit" disabled>ASK AI</button>
                </div>
            </form>

            <article class="answer-card">
                <div class="answer-label">AI answer</div>
                <div id="answer-text">The AI answer will appear here.</div>
            </article>

            <p id="error-container"></p>

            <p class="hint">
                Place an object in view, enter a question, then click ASK AI.
            </p>
        </section>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
