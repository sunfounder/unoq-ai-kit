<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Show and Tell</title>
    <link rel="icon" type="image/png" href="./img/sf_logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="./img/sf_logo.png" alt="SunFounder Logo">
        <h1>AI Show and Tell</h1>
        <p>Speech-to-Text · Vision AI · Text-to-Speech</p>
    </header>

    <main>
        <section class="card">
            <div class="connection">
                <span id="status-dot" class="status-indicator"></span>
                <span id="connection-label">Connecting</span>
            </div>

            <div class="camera-frame">
                <img id="camera-stream" src="" alt="Live camera view">
                <div class="camera-placeholder">Waiting for camera...</div>
            </div>

            <section id="status-panel" class="status-panel">
                <strong id="status-title">Connecting...</strong>
                <span id="status-message">Waiting for the app.</span>
            </section>

            <button id="speak-button" type="button" disabled>
                <span class="microphone">🎤</span>
                <span id="button-label">Hold to Speak</span>
            </button>

            <section class="conversation">
                <article class="speech-card heard-card">
                    <div class="section-label">You Said</div>
                    <p id="heard-text">Your question will appear here.</p>
                </article>

                <article class="speech-card answer-card">
                    <div class="section-label">AI Reply</div>
                    <p id="answer-text">The AI answer will appear here.</p>
                </article>
            </section>

            <p id="error-container"></p>
            <p class="hint">Place an object in view. Hold the button while speaking, then release it.</p>
        </section>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
