<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AI Voice Assistant</h1>
        <p>Speech-to-Text · LLM · Text-to-Speech</p>
    </header>

    <main>
        <section class="card">
            <div class="connection">
                <span id="status-dot" class="status-indicator"></span>
                <span id="status-label">Connecting</span>
            </div>

            <div id="status-panel" class="status-panel">
                <strong id="status-title">Connecting...</strong>
                <span id="status-message">Waiting for the app.</span>
            </div>

            <button id="talk-button" type="button" disabled>
                <span class="mic">🎤</span>
                <span id="button-label">Hold to Speak</span>
            </button>

            <section class="conversation">
                <article class="message user">
                    <div class="message-label">You said</div>
                    <div id="heard-text">Your speech will appear here.</div>
                </article>

                <article class="message assistant">
                    <div class="message-label">AI reply</div>
                    <div id="reply-text">The AI response will appear here.</div>
                </article>
            </section>

            <p id="error-container"></p>

            <p class="hint">
                Press and hold while speaking, then release.
            </p>
        </section>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
