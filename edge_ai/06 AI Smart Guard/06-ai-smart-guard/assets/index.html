<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Guard</title>
    <link rel="icon" type="image/png" href="./img/sf_logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AI Smart Guard</h1>
        <img src="./img/sf_logo.png" alt="SunFounder Logo">
    </header>

    <main>
        <div class="card">
            <div class="status-row">
                <span class="status-indicator" id="status-dot"></span>
                <span class="status-label" id="status-label">Connecting</span>
            </div>

            <div class="camera-container">
                <iframe id="camera-stream" title="Camera" frameborder="0"
                        allow="autoplay" style="display: none;"></iframe>
            </div>

            <div id="guard-status" class="status-clear">
                <span id="guard-icon">🟢</span>
                <span id="guard-text">All clear — scanning</span>
            </div>

            <p id="status-text">AI Smart Guard protecting the perimeter</p>
            <p id="error-container"></p>
        </div>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
