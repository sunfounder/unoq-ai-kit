<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Rock Paper Scissors</title>
    <link rel="icon" type="image/png" href="./img/sf_logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AI Rock Paper Scissors</h1>
        <img src="./img/sf_logo.png" alt="SunFounder Logo">
    </header>

    <main>
        <div class="main-layout">
            <section class="card camera-card">
                <div class="status-row">
                    <span id="status-dot" class="status-indicator"></span>
                    <span id="status-label" class="status-label">CONNECTING</span>
                </div>

                <div class="camera-container">
                    <div id="video-placeholder" class="video-placeholder">
                        <div>📷</div>
                        <p>Searching for camera...</p>
                    </div>
                    <iframe id="camera-stream" title="AI camera" frameborder="0"
                            allow="autoplay" style="display:none"></iframe>
                </div>

                <div class="gesture-strip">
                    <span>DETECTED GESTURE</span>
                    <strong id="live-gesture">NONE</strong>
                    <small id="live-confidence">0%</small>
                </div>
                <p id="error-container"></p>
            </section>

            <section class="card game-card">
                <div id="phase-label" class="phase-label">READY</div>
                <div id="countdown" class="countdown" hidden>3</div>
                <h2 id="game-message">Press START GAME to begin</h2>

                <div class="battle">
                    <div class="choice">
                        <span>YOU</span>
                        <div id="player-icon" class="choice-icon">—</div>
                        <strong id="player-move">WAITING</strong>
                    </div>
                    <div class="versus">VS</div>
                    <div class="choice">
                        <span>COMPUTER</span>
                        <div id="computer-icon" class="choice-icon">—</div>
                        <strong id="computer-move">WAITING</strong>
                    </div>
                </div>

                <div id="result-banner" class="result-banner">PRESS START GAME</div>

                <div class="scoreboard">
                    <div><span>PLAYER</span><strong id="player-score">0</strong></div>
                    <div><span>TIES</span><strong id="tie-score">0</strong></div>
                    <div><span>COMPUTER</span><strong id="computer-score">0</strong></div>
                </div>

                <div class="button-row">
                    <button id="start-game" class="primary-button">START GAME</button>
                    <button id="reset-score">RESET SCORE</button>
                </div>
                <p class="tip">✊ Rock &nbsp; ✋ Paper &nbsp; ✌️ Scissors</p>
            </section>
        </div>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
