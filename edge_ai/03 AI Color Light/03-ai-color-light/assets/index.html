<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Object Color Light</title>
    <link rel="icon" type="image/png" href="./img/sf_logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AI Object Color Light</h1>
        <img src="./img/sf_logo.png" alt="SunFounder Logo">
    </header>

    <main>
        <div class="main-layout">
            <section class="card card-video">
                <div class="status-row">
                    <span class="status-indicator" id="status-dot"></span>
                    <span class="status-label" id="status-label">Connecting</span>
                </div>

                <div class="camera-container">
                    <iframe id="camera-stream" title="Camera" frameborder="0"
                            allow="autoplay" style="display: none;"></iframe>
                </div>

                <p id="status-text">Show a mapped object to the camera</p>
                <p id="error-container"></p>
            </section>

            <section class="card card-result">
                <h2>AI Result</h2>

                <div id="color-preview" class="color-preview off"></div>

                <div class="result-row">
                    <span class="result-label">Object</span>
                    <strong id="object-name">Waiting...</strong>
                </div>

                <div class="result-row">
                    <span class="result-label">LED Color</span>
                    <strong id="color-name">Off</strong>
                </div>

                <div class="result-row">
                    <span class="result-label">Confidence</span>
                    <strong id="confidence-value">--</strong>
                </div>

                <div class="supported-list">
                    <p>Supported examples</p>
                    <span>Apple</span>
                    <span>Banana</span>
                    <span>Orange</span>
                    <span>Broccoli</span>
                    <span>Bottle</span>
                    <span>Person</span>
                </div>
            </section>
        </div>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
