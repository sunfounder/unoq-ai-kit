<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Voice Message</title>
    <link rel="icon" type="image/png" href="./img/sf_logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>IoT Voice Message</h1>
        <img src="./img/sf_logo.png" alt="SunFounder Logo">
    </header>

    <main>
        <div class="card">
            <div class="status-row">
                <span class="status-indicator" id="status-dot"></span>
                <span class="status-label" id="status-label">Ready</span>
            </div>

            <div class="microphone">
                <div class="mic-icon">🎙</div>
                <div>
                    <div class="mic-title">Voice Recorder</div>
                    <div class="timer" id="timer">00:00.0</div>
                </div>
            </div>

            <div class="meter-wrap">
                <div class="meter-label">Live Audio Level</div>
                <div class="waveform" id="waveform"></div>
            </div>

            <div class="controls">
                <button class="record-button" id="record-button">Record</button>
                <button class="play-button" id="play-button" disabled>Play</button>
            </div>

            <p id="status-text">Click Record, then speak toward the UNO Q microphone.</p>
            <p id="error-container"></p>
        </div>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
