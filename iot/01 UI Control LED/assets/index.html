<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Control LED</title>
    <link rel="icon" type="image/png" href="./img/sf_logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>UI Control LED</h1>
        <img src="./img/sf_logo.png" alt="SunFounder Logo">
    </header>

    <main>
        <div class="card">
            <div class="status-row">
                <span class="status-indicator" id="status-dot"></span>
                <span class="status-label" id="status-label">Ready</span>
            </div>

            <button id="led-button" class="led-off">LED IS OFF</button>

            <p id="status-text">Click to control the LED</p>
            <p id="error-container"></p>
        </div>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
